[project]
name = "ept-support-hub-ai"
version = "0.1.0"
description = "Internal AI micro-service for EPT Support Hub (classification, correlation, speech-to-text)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Added progressively from milestone M4 (kept out of M0 to keep the image small):
# ml = ["scikit-learn", "sentence-transformers", "psycopg[binary]", "pgvector"]
# stt = ["faster-whisper"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
