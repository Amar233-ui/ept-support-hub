name: CI backend

on:
  pull_request:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/ci-backend.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', '.github/workflows/ci-backend.yml']

  backend:
    needs: changes
    # Skipped jobs count as success for required checks, so unrelated PRs are not blocked.
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format check (Spotless)
        run: ./mvnw -B -q spotless:check
      - name: Unit + integration tests (Testcontainers)
        run: ./mvnw -B verify
      - name: Coverage report on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Couverture backend
          update-comment: true
