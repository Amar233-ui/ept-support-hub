name: Bug
description: Signaler un comportement incorrect
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, ce qui était attendu.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Zone
      options: [backend, frontend, ai, infra]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / captures
      render: shell
