# Public reverse proxy (prod). TLS is expected to be terminated in front of this
# container or added here in M7 (see docs/deployment.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m; # aligned with UPLOAD_MAX_REQUEST_SIZE
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # REST API (includes the OAuth2 redirect endpoints)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # STOMP over WebSocket
    location /ws {
        proxy_pass http://backend:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Internal Actuator endpoints are never public
    location /api/actuator/ {
        deny all;
    }

    # SPA (served by the frontend image)
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
