# Git hooks (installed by `make setup`). Kept light: only staged files, format + lint.
pre-commit:
  parallel: true
  commands:
    backend-format:
      root: backend/
      glob: '*.java'
      run: ./mvnw -q -B spotless:apply -DspotlessFiles="{staged_files}" && git add {staged_files}
    frontend-lint:
      root: frontend/
      glob: '*.{ts,vue,js,css,json}'
      run: npx prettier --write {staged_files} && npx eslint --fix {staged_files} && git add {staged_files}
    ai-lint:
      root: ai-service/
      glob: '*.py'
      run: uv run ruff format {staged_files} && uv run ruff check --fix {staged_files} && git add {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' || {
          echo "Message de commit non conforme à Conventional Commits : type(scope): description"
          exit 1
        }
