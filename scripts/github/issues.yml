# Source de vérité de la planification GitHub (labels, milestones, issues).
# Appliqué par scripts/github/bootstrap.sh (idempotent : une issue est identifiée par son titre).
#
# Champs d'une issue :
#   id        identifiant stable (M3-07), utilisable dans related: / depends:
#   type      feature | bug | task | docs | design        -> label type:*
#   area      liste parmi backend, frontend, ai, infra, docs -> labels area:*
#   prio      high | medium | low                         -> label prio:*
#   size      S (≤ 0,5 j) | M (≈ 1 j) | L (≈ 2 j)         -> label size:*
#   assignee  pseudo GitHub
#   done      true si déjà livré (l'issue est créée puis fermée, pour la traçabilité)
#   related   issues liées (paire back/front, relecture croisée)
#   depends   issues bloquantes
#   extra_labels  ex. ["good first issue"]

people:
  A: Amar233-ui    # Mame Goumba Amar — backend cœur, infra
  F: falloungom04  # Serigne Fallou Ngom — frontend, design system, IA

labels:
  - { name: "type:feature", color: "1F6B4F", description: "Nouvelle fonctionnalité" }
  - { name: "type:bug", color: "B42318", description: "Comportement incorrect" }
  - { name: "type:task", color: "5F5B54", description: "Tâche technique, outillage, infra" }
  - { name: "type:docs", color: "2759A8", description: "Documentation" }
  - { name: "type:design", color: "8E4EC6", description: "Design, UX, maquettes" }
  - { name: "area:backend", color: "D4C5A9", description: "Spring Boot" }
  - { name: "area:frontend", color: "C5DDD1", description: "Vue 3" }
  - { name: "area:ai", color: "E6D3F5", description: "Micro-service IA Python" }
  - { name: "area:infra", color: "D6D2CA", description: "Docker, CI, déploiement" }
  - { name: "area:docs", color: "C9D8F0", description: "docs/, README, guides" }
  - { name: "prio:high", color: "B42318", description: "Bloquant pour le milestone" }
  - { name: "prio:medium", color: "E0A043", description: "Important" }
  - { name: "prio:low", color: "A8A39A", description: "Souhaitable" }
  - { name: "size:S", color: "EDEBE7", description: "≤ 0,5 jour" }
  - { name: "size:M", color: "D6D2CA", description: "≈ 1 jour" }
  - { name: "size:L", color: "A8A39A", description: "≈ 2 jours (sinon découper)" }
  - { name: "good first issue", color: "7057FF", description: "Bon point d'entrée" }
  - { name: "blocked", color: "000000", description: "Bloquée par une dépendance externe ou une autre issue" }

milestones:
  - key: M0
    title: "M0 — Fondations"
    due: "2026-10-11"
    description: "Repo, Docker, CI, conventions, squelettes des 3 services qui démarrent, tokens de design, CLAUDE.md."
  - key: M1
    title: "M1 — Conception"
    due: "2026-10-25"
    description: "UML, modèle de données + migrations Flyway initiales, composants de base du design system, contrat OpenAPI v1, ADR."
  - key: M2
    title: "M2 — Auth & organisation"
    due: "2026-11-08"
    description: "Google OAuth @ept.sn, validation des comptes, rôles, services, zones, administration des comptes, login dev."
  - key: M3
    title: "M3 — Tickets cœur"
    due: "2026-11-29"
    description: "CRUD, machine à états, commentaires, pièces jointes, historique, SLA, notifications in-app + email."
  - key: M4
    title: "M4 — IA v1"
    due: "2026-12-06"
    description: "Classification, routage, suggestion d'assignation, corrélation par zone, jeu de données, intégration résiliente. Milestone court : le travail IA (jeu de données, modèle) démarre en parallèle dès M2."
  - key: M5
    title: "M5 — Pilotage"
    due: "2026-12-13"
    description: "Dashboards par rôle, rapports PDF, besoins temporaires, journal d'audit."
  - key: M6
    title: "M6 — Modules étendus (stretch)"
    due: "2026-12-20"
    description: "STRETCH : module vigiles, speech-to-text, WhatsApp (feature flag). À ne commencer que si M0 à M5 sont terminés ; sinon présenté comme piste v2."
  - key: M7
    title: "M7 — Recette & livraison"
    due: "2026-12-29"
    description: "Tests e2e des parcours clés, perf de base, sécurité (OWASP Top 10), déploiement prod, guides, données de démo, support de soutenance (2027-01-01)."

