<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plateforme de gestion des incidents et du support de l'École Polytechnique de Thiès"
    />
    <title>EPT Support Hub</title>
    <script>
      // Apply the theme before first paint to avoid a light flash in dark mode.
      ;(function () {
        try {
          var stored = localStorage.getItem('eptsh-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
